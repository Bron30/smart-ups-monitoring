
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secure UPS Access</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 380px;
      padding: 28px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 25px;
      margin: 0 0 12px;
    }

    .subtitle {
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
    }

    .device {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin: 18px 0;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #475569;
      border-radius: 8px;
      background: #f8fafc;
      color: #0f172a;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 18px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="box">

    <h1>🔐 Secure UPS Access</h1>

    <p class="subtitle">
      Sign in to access the authorized UPS monitoring system.
    </p>

    <div class="device" id="deviceInfo">
      Checking QR authorization...
    </div>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="Email address"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="footer">
      QR-Enabled Intelligent UPS Monitoring and Maintenance System
    </p>

  </main>

  <script type="module">

    import { initializeApp, getApps }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      get,
      push,
      set
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    // ==========================================
    // FIREBASE CONFIGURATION
    // Keep your existing Firebase project values.
    // ==========================================

    const firebaseConfig = {
      apiKey: "AIzaSyAtUjNOxehowo3hBGQZ2Ln3-XgG7-LFTFo",
      authDomain: "qr-machine-project.firebaseapp.com",
      databaseURL:
        "https://qr-machine-project-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qr-machine-project",
      storageBucket: "qr-machine-project.firebasestorage.app",
      messagingSenderId: "598012619360",
      appId: "1:598012619360:web:866a499dc738adf66f3105"
    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app = getApps().length
      ? getApps()[0]
      : initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const database = getDatabase(app);


    // ==========================================
    // READ URL PARAMETERS
    // ==========================================

    const params = new URLSearchParams(
      window.location.search
    );

    const qrId = params.get("id") || "";

    const deviceInfo = document.getElementById("deviceInfo");
    const message = document.getElementById("message");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");

    // This project currently uses UPS1 as its database unit.
    const upsId = "UPS1";

    // Only allow the expected QR identifier format.
    const validQrId = /^UPS[0-9]{3,}$/i.test(qrId);

    // ==========================================
    // VALIDATE RETURN DESTINATION
    // Only allow known pages on this same website.
    // ==========================================

    const allowedReturnPages = [
      "index.html",
      "UPS.html",
      "maintenance.html",
      "documentation.html",
      "manual.html",
      "troubleshooting.html"
    ];

    function getSafeReturnUrl() {
      const returnValue = params.get("return");

      if (!returnValue) {
        return "index.html";
      }

      try {
        const parsed = new URL(
          returnValue,
          window.location.origin
        );

        if (parsed.origin !== window.location.origin) {
          return "index.html";
        }

        const page = parsed.pathname.split("/").pop();

        if (!allowedReturnPages.includes(page)) {
          return "index.html";
        }

        // Preserve the requested page's query parameters,
        // but ensure its UPS ID is the validated unit ID.
        const query = new URLSearchParams(
          parsed.search
        );

        query.set("id", upsId);

        return page + "?" + query.toString();

      } catch (error) {
        return "index.html";
      }
    }


    const destination = getSafeReturnUrl();


    // ==========================================
    // INITIAL PAGE STATE
    // ==========================================

    if (!validQrId) {
      deviceInfo.textContent = "Invalid QR Code";
      message.textContent =
        "Access denied. Scan a valid UPS QR code.";

      loginForm.style.display = "none";

    } else {
      deviceInfo.textContent = "QR Device: " + qrId.toUpperCase();
    }


    // ==========================================
    // LOGIN AND QR AUTHORIZATION
    // ==========================================

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!validQrId) {
        message.textContent = "Access denied: Invalid QR code.";
        return;
      }

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        message.textContent = "Enter your email and password.";
        return;
      }

      loginButton.disabled = true;
      message.textContent = "Authenticating...";

      try {

        // Step 1: Authenticate the user.
        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        const currentUser = credential.user;

        if (!currentUser) {
          throw new Error("Authenticated user could not be verified.");
        }

        message.textContent = "Checking QR authorization...";

        // Step 2: Read the existing QR security record.
        const securityRef = ref(
          database,
          upsId + "/Security"
        );

        const securitySnapshot = await get(securityRef);

        if (!securitySnapshot.exists()) {
          message.textContent =
            "Security configuration not found. Contact the administrator.";
          return;
        }

        const security = securitySnapshot.val();

        // Step 3: Confirm the QR ID matches and is active.
        if (
          security.QR_ID !== qrId ||
          security.Status !== "ACTIVE"
        ) {
          message.textContent =
            "Access denied: Invalid or revoked QR.";

          return;
        }

        // Step 4: Create a new access log.
        // Existing log entries are not overwritten.
        const logsRef = ref(
          database,
          upsId + "/AccessLogs"
        );

        const newLogRef = push(logsRef);

        await set(newLogRef, {
          QR_ID: qrId,
          User: currentUser.email || email,
          Status: "GRANTED",
          Timestamp: new Date().toISOString()
        });

        // Step 5: Redirect only after authorization and logging succeed.
        message.textContent =
          "Access granted. Opening requested page...";

        loginButton.disabled = true;

        window.location.replace(destination);

      } catch (error) {

        console.error("Gateway error:", error);

        const errorMessages = {
          "auth/invalid-email":
            "Enter a valid email address.",
          "auth/user-disabled":
            "This account has been disabled.",
          "auth/user-not-found":
            "No account was found for this email.",
          "auth/wrong-password":
            "Incorrect email or password.",
          "auth/invalid-credential":
            "Incorrect email or password.",
          "auth/too-many-requests":
            "Too many attempts. Please try again later.",
          "auth/network-request-failed":
            "Network error. Check your internet connection.",
          "PERMISSION_DENIED":
            "Firebase denied access. Check the existing database rules."
        };

        message.textContent =
          errorMessages[error.code] ||
          "Login or authorization failed. Please try again.";

        loginButton.disabled = false;

      }
    });

  </script>

</body>
</html>

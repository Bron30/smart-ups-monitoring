<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>UPS Troubleshooting Guide</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      line-height: 1.6;
    }

    header {
      background: #020617;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 950px;
      margin: 30px auto;
      padding: 20px;
    }

    /* =========================
       PROBLEM LIST
       ========================= */

    .problem-list {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .problem-list h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    .problem-button {
      display: block;
      width: 100%;
      box-sizing: border-box;

      background: #334155;
      color: white;

      border: none;
      border-radius: 8px;

      padding: 15px;
      margin: 10px 0;

      text-align: left;
      font-size: 16px;

      cursor: pointer;

      transition: 0.3s;
    }

    .problem-button:hover {
      background: #475569;
      transform: translateX(5px);
    }

    /* =========================
       PROBLEM DETAILS
       ========================= */

    .problem-details {
      display: none;

      background: #1e293b;

      padding: 25px;

      border-radius: 12px;

      margin-top: 20px;
    }

    .problem-details h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    .cause {
      background: #334155;

      padding: 18px;

      border-radius: 8px;

      margin-top: 15px;
    }

    .solution {
      background: #14532d;

      padding: 18px;

      border-radius: 8px;

      margin-top: 15px;
    }

    .cause h3,
    .solution h3 {
      margin-top: 0;
    }

    /* =========================
       BACK BUTTON
       ========================= */

    .back-button {
      text-align: center;
      margin: 30px;
    }

    button.back {
      padding: 12px 25px;

      background: #2563eb;

      border: none;

      border-radius: 8px;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button.back:hover {
      background: #1d4ed8;
    }

  </style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <h1>🔧 UPS Troubleshooting Guide</h1>

  <p>Smart DC UPS Monitoring System</p>

</header>


<div class="container">


  <!-- =========================
       PROBLEM LIST
       ========================= -->

  <div class="problem-list">

    <h2>Select a Problem</h2>

    <p>
      Select the problem you are experiencing to view
      the possible cause and recommended action.
    </p>


    <button
      class="problem-button"
      onclick="showProblem('noData')">

      1. Dashboard Shows No Data

    </button>


    <button
      class="problem-button"
      onclick="showProblem('voltage')">

      2. Battery Voltage Not Displayed

    </button>


    <button
      class="problem-button"
      onclick="showProblem('battery')">

      3. Battery Percentage Appears Incorrect

    </button>


    <button
      class="problem-button"
      onclick="showProblem('temperature')">

      4. Temperature Reading is High

    </button>


    <button
      class="problem-button"
      onclick="showProblem('vibration')">

      5. Vibration Detected

    </button>


    <button
      class="problem-button"
      onclick="showProblem('fault')">

      6. UPS Status Shows FAULT

    </button>

  </div>


  <!-- =========================
       PROBLEM DETAILS
       ========================= -->

  <div
    id="problemDetails"
    class="problem-details">


    <h2 id="problemTitle">
      Select a problem
    </h2>


    <!-- POSSIBLE CAUSE -->

    <div class="cause">

      <h3>
        ⚠️ Possible Cause
      </h3>

      <div id="causeText">
        --
      </div>

    </div>


    <!-- RECOMMENDED ACTION -->

    <div class="solution">

      <h3>
        ✅ Recommended Action
      </h3>

      <div id="solutionText">
        --
      </div>

    </div>


  </div>


</div>


<!-- =========================
     BACK BUTTON
     ========================= -->

<div class="back-button">

  <button
    class="back"
    onclick="goBack()">

    ⬅ Back to Documentation

  </button>

</div>


<script>


// =====================================================
// INTERACTIVE TROUBLESHOOTING DATA
// =====================================================

const troubleshootingData = {


  // ---------------------------------------------------
  // 1. DASHBOARD NO DATA
  // ---------------------------------------------------

  noData: {

    title:
      "1. Dashboard Shows No Data",

    cause: `
      <ul>

        <li>ESP32 is not powered.</li>

        <li>ESP32 is not connected to Wi-Fi.</li>

        <li>Firebase connection is unavailable.</li>

        <li>Sensor data is not being transmitted.</li>

      </ul>
    `,

    solution: `
      <ol>

        <li>Check ESP32 power supply.</li>

        <li>Check Wi-Fi availability.</li>

        <li>Check ESP32 serial monitor.</li>

        <li>Verify Firebase data.</li>

        <li>Check sensor connections.</li>

      </ol>
    `

  },


  // ---------------------------------------------------
  // 2. BATTERY VOLTAGE
  // ---------------------------------------------------

  voltage: {

    title:
      "2. Battery Voltage Not Displayed",

    cause: `
      <ul>

        <li>Voltage sensor is disconnected.</li>

        <li>Sensor wiring is incorrect.</li>

        <li>ESP32 is not receiving the sensor value.</li>

      </ul>
    `,

    solution: `
      <ol>

        <li>Check voltage sensor wiring.</li>

        <li>Check the sensor output.</li>

        <li>Verify the ESP32 input pin.</li>

        <li>Check the value stored in Firebase.</li>

      </ol>
    `

  },


  // ---------------------------------------------------
  // 3. BATTERY PERCENTAGE
  // ---------------------------------------------------

  battery: {

    title:
      "3. Battery Percentage Appears Incorrect",

    cause: `
      <ul>

        <li>Incorrect battery voltage measurement.</li>

        <li>
          Battery voltage-to-percentage mapping
          is inaccurate.
        </li>

        <li>Battery condition has changed.</li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Verify the measured battery voltage.
        </li>

        <li>
          Check the battery percentage calculation.
        </li>

        <li>
          Compare the reading with a suitable
          multimeter measurement.
        </li>

      </ol>
    `

  },


  // ---------------------------------------------------
  // 4. TEMPERATURE
  // ---------------------------------------------------

  temperature: {

    title:
      "4. Temperature Reading is High",

    cause: `
      <ul>

        <li>
          UPS is operating under high load.
        </li>

        <li>
          Insufficient ventilation.
        </li>

        <li>
          Ambient temperature is high.
        </li>

        <li>
          Temperature sensor is positioned incorrectly.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>Check the UPS load.</li>

        <li>Improve ventilation.</li>

        <li>
          Check the temperature sensor position.
        </li>

        <li>
          Allow the system to cool before
          further operation if necessary.
        </li>

      </ol>
    `

  },


  // ---------------------------------------------------
  // 5. VIBRATION
  // ---------------------------------------------------

  vibration: {

    title:
      "5. Vibration Detected",

    cause: `
      <ul>

        <li>UPS enclosure is moving.</li>

        <li>
          External mechanical vibration is present.
        </li>

        <li>
          SW-420 vibration sensor is too sensitive.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>Check the UPS mounting.</li>

        <li>
          Check nearby mechanical equipment.
        </li>

        <li>
          Verify the SW-420 sensor mounting.
        </li>

      </ol>
    `

  },


  // ---------------------------------------------------
  // 6. UPS FAULT
  // ---------------------------------------------------

  fault: {

    title:
      "6. UPS Status Shows FAULT",

    cause: `
      <ul>

        <li>
          Battery voltage is outside the expected range.
        </li>

        <li>
          Temperature is too high.
        </li>

        <li>
          Abnormal current is detected.
        </li>

        <li>
          Vibration condition is abnormal.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>Check battery voltage.</li>

        <li>Check temperature.</li>

        <li>Check load current.</li>

        <li>Check vibration condition.</li>

        <li>
          Inspect the UPS if the fault persists.
        </li>

      </ol>
    `

  }

};


// =====================================================
// SHOW SELECTED PROBLEM
// =====================================================

function showProblem(problemId) {


  const problem =
    troubleshootingData[problemId];


  if (!problem) {
    return;
  }


  // Change problem title

  document.getElementById(
    "problemTitle"
  ).innerHTML =
    problem.title;


  // Change possible cause

  document.getElementById(
    "causeText"
  ).innerHTML =
    problem.cause;


  // Change recommended action

  document.getElementById(
    "solutionText"
  ).innerHTML =
    problem.solution;


  // Show details

  document.getElementById(
    "problemDetails"
  ).style.display =
    "block";


  // Scroll to details

  document.getElementById(
    "problemDetails"
  ).scrollIntoView({
    behavior: "smooth"
  });

}


// =====================================================
// BACK TO DOCUMENTATION
// =====================================================

function goBack() {

  window.location.href =
    "documentation.html";

}


</script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>UPS Troubleshooting Guide</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      line-height: 1.6;
    }

    header {
      background: #020617;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 950px;
      margin: 30px auto;
      padding: 20px;
    }

    /* =========================
       PROBLEM LIST
       ========================= */

    .problem-list {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .problem-list h2 {
      color: #38bdf8;
      margin-top: 0;
    }

    .problem-list p {
      color: #cbd5e1;
    }

    .problem-button {
      display: block;
      width: 100%;
      box-sizing: border-box;

      background: #334155;
      color: white;

      border: none;
      border-radius: 8px;

      padding: 15px;
      margin: 10px 0;

      text-align: left;
      font-size: 16px;

      cursor: pointer;

      transition: 0.3s;
    }

    .problem-button:hover {
      background: #475569;
      transform: translateX(5px);
    }


    /* =========================
       PROBLEM DETAILS
       ========================= */

    .problem-details {
      display: none;

      background: #1e293b;

      padding: 25px;

      border-radius: 12px;

      margin-top: 20px;
    }

    .problem-details h2 {
      color: #38bdf8;
      margin-top: 0;
    }


    /* =========================
       POSSIBLE CAUSE
       ========================= */

    .cause {
      background: #334155;

      padding: 18px;

      border-radius: 8px;

      margin-top: 15px;
    }

    .cause h3 {
      margin-top: 0;
      color: #facc15;
    }


    /* =========================
       RECOMMENDED ACTION
       ========================= */

    .solution {
      background: #14532d;

      padding: 18px;

      border-radius: 8px;

      margin-top: 15px;
    }

    .solution h3 {
      margin-top: 0;
      color: #86efac;
    }


    /* =========================
       BACK BUTTON
       ========================= */

    .back-button {
      text-align: center;
      margin: 30px;
    }

    button.back {
      padding: 12px 25px;

      background: #2563eb;

      border: none;

      border-radius: 8px;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button.back:hover {
      background: #1d4ed8;
    }

  </style>

</head>


<body>


<!-- =========================
     HEADER
     ========================= -->

<header>

  <h1>🔧 UPS Troubleshooting Guide</h1>

  <p>
    Smart DC UPS Monitoring System
  </p>

</header>


<div class="container">


  <!-- =========================
       PROBLEM LIST
       ========================= -->

  <div class="problem-list">

    <h2>What problem are you experiencing?</h2>

    <p>
      Select the problem below to view the possible
      causes and recommended actions.
    </p>


    <!-- 1 -->

    <button
      class="problem-button"
      onclick="showProblem('noPower')">

      ⚡ UPS/Inverter is Not Supplying Power

    </button>


    <!-- 2 -->

    <button
      class="problem-button"
      onclick="showProblem('notCharging')">

      🔋 Battery is Not Charging

    </button>


    <!-- 3 -->

    <button
      class="problem-button"
      onclick="showProblem('lowBackup')">

      ⏱️ Backup Time is Very Low

    </button>


    <!-- 4 -->

    <button
      class="problem-button"
      onclick="showProblem('voltage')">

      ⚡ Battery Voltage is Abnormal

    </button>


    <!-- 5 -->

    <button
      class="problem-button"
      onclick="showProblem('overheating')">

      🌡️ UPS/Inverter is Overheating

    </button>


    <!-- 6 -->

    <button
      class="problem-button"
      onclick="showProblem('noise')">

      🔊 Unusual Noise or Vibration

    </button>


    <!-- 7 -->

    <button
      class="problem-button"
      onclick="showProblem('fault')">

      ⚠️ UPS/Inverter Shows FAULT

    </button>


    <!-- 8 -->

    <button
      class="problem-button"
      onclick="showProblem('unstableOutput')">

      ⚡ Output Power is Unstable

    </button>


    <!-- 9 -->

    <button
      class="problem-button"
      onclick="showProblem('frequentBattery')">

      🔄 UPS Switches to Battery Frequently

    </button>


    <!-- 10 -->

    <button
      class="problem-button"
      onclick="showProblem('notTurningOn')">

      🔴 UPS/Inverter Does Not Turn ON

    </button>

  </div>



  <!-- =========================
       PROBLEM DETAILS
       ========================= -->

  <div
    id="problemDetails"
    class="problem-details">


    <h2 id="problemTitle">
      Select a problem
    </h2>


    <!-- POSSIBLE CAUSE -->

    <div class="cause">

      <h3>
        ⚠️ Possible Cause
      </h3>

      <div id="causeText">
        --
      </div>

    </div>


    <!-- RECOMMENDED ACTION -->

    <div class="solution">

      <h3>
        ✅ Recommended Action
      </h3>

      <div id="solutionText">
        --
      </div>

    </div>


  </div>


</div>



<!-- =========================
     BACK BUTTON
     ========================= -->

<div class="back-button">

  <button
    class="back"
    onclick="goBack()">

    ⬅ Back to Documentation

  </button>

</div>



<script>


// =====================================================
// PRACTICAL UPS TROUBLESHOOTING DATABASE
// =====================================================

const troubleshootingData = {


  // ===================================================
  // 1. UPS NOT SUPPLYING POWER
  // ===================================================

  noPower: {

    title:
      "⚡ UPS/Inverter is Not Supplying Power",

    cause: `
      <ul>

        <li>
          Mains power may be unavailable.
        </li>

        <li>
          Battery may be deeply discharged.
        </li>

        <li>
          UPS output protection may have activated.
        </li>

        <li>
          Connected load may exceed the rated capacity.
        </li>

        <li>
          An internal UPS fault may be present.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Check whether mains power is available.
        </li>

        <li>
          Check the UPS input and output connections.
        </li>

        <li>
          Reduce excessive connected load.
        </li>

        <li>
          Check the battery condition.
        </li>

        <li>
          Restart the UPS according to the manufacturer's
          operating procedure.
        </li>

        <li>
          If the problem persists, arrange professional
          inspection or service.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 2. BATTERY NOT CHARGING
  // ===================================================

  notCharging: {

    title:
      "🔋 Battery is Not Charging",

    cause: `
      <ul>

        <li>
          Mains input may be unavailable.
        </li>

        <li>
          Battery connections may be loose.
        </li>

        <li>
          Battery may be aged or damaged.
        </li>

        <li>
          Charging circuit may have a fault.
        </li>

        <li>
          Battery voltage may be outside the expected range.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Confirm that mains power is available.
        </li>

        <li>
          Check the battery connections.
        </li>

        <li>
          Check the battery voltage.
        </li>

        <li>
          Allow sufficient charging time.
        </li>

        <li>
          If the battery still does not charge,
          arrange battery or UPS inspection.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 3. LOW BACKUP TIME
  // ===================================================

  lowBackup: {

    title:
      "⏱️ Backup Time is Very Low",

    cause: `
      <ul>

        <li>
          Battery capacity may have degraded.
        </li>

        <li>
          Connected load may be too high.
        </li>

        <li>
          Battery may not be fully charged.
        </li>

        <li>
          Battery may be near the end of its service life.
        </li>

        <li>
          UPS operating conditions may be abnormal.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Check the connected load.
        </li>

        <li>
          Ensure that the battery is fully charged.
        </li>

        <li>
          Check the battery voltage.
        </li>

        <li>
          Reduce unnecessary loads.
        </li>

        <li>
          If backup time remains very low,
          have the battery tested.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 4. ABNORMAL BATTERY VOLTAGE
  // ===================================================

  voltage: {

    title:
      "⚡ Battery Voltage is Abnormal",

    cause: `
      <ul>

        <li>
          Battery may be over-discharged.
        </li>

        <li>
          Battery may be overcharged.
        </li>

        <li>
          Battery terminals may have a poor connection.
        </li>

        <li>
          Battery may be aged or damaged.
        </li>

        <li>
          Charging or protection circuitry may have a fault.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Check the battery voltage using an appropriate
          measuring instrument.
        </li>

        <li>
          Check battery terminal connections.
        </li>

        <li>
          Allow the battery to charge properly.
        </li>

        <li>
          Avoid continued operation if the battery
          voltage is significantly abnormal.
        </li>

        <li>
          Arrange professional inspection if the
          abnormal condition persists.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 5. OVERHEATING
  // ===================================================

  overheating: {

    title:
      "🌡️ UPS/Inverter is Overheating",

    cause: `
      <ul>

        <li>
          UPS may be operating with excessive load.
        </li>

        <li>
          Ventilation openings may be blocked.
        </li>

        <li>
          Ambient temperature may be high.
        </li>

        <li>
          Cooling system may not be operating properly.
        </li>

        <li>
          UPS may have an internal fault.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Reduce the connected load.
        </li>

        <li>
          Ensure that ventilation openings are clear.
        </li>

        <li>
          Move the UPS to a suitable, well-ventilated location.
        </li>

        <li>
          Allow the unit to cool before continued operation.
        </li>

        <li>
          If overheating continues, stop operation and
          arrange professional inspection.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 6. UNUSUAL NOISE OR VIBRATION
  // ===================================================

  noise: {

    title:
      "🔊 Unusual Noise or Vibration",

    cause: `
      <ul>

        <li>
          Cooling fan may be obstructed or damaged.
        </li>

        <li>
          UPS may not be mounted securely.
        </li>

        <li>
          Internal components may be vibrating.
        </li>

        <li>
          Mechanical components may be worn.
        </li>

        <li>
          An internal electrical or mechanical fault
          may be present.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Check whether the UPS is securely positioned.
        </li>

        <li>
          Check for objects blocking ventilation.
        </li>

        <li>
          Listen for unusual fan or mechanical sounds.
        </li>

        <li>
          Do not open the UPS enclosure unless qualified
          to perform the inspection.
        </li>

        <li>
          If unusual noise continues, arrange professional
          inspection.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 7. UPS FAULT
  // ===================================================

  fault: {

    title:
      "⚠️ UPS/Inverter Shows FAULT",

    cause: `
      <ul>

        <li>
          Battery voltage may be outside the acceptable range.
        </li>

        <li>
          UPS may be overloaded.
        </li>

        <li>
          Temperature may be too high.
        </li>

        <li>
          Output protection may have activated.
        </li>

        <li>
          An internal UPS fault may be present.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Check the UPS load.
        </li>

        <li>
          Check the battery condition.
        </li>

        <li>
          Check whether the unit is overheating.
        </li>

        <li>
          Disconnect unnecessary loads.
        </li>

        <li>
          Restart the UPS according to the manufacturer's
          instructions.
        </li>

        <li>
          If FAULT remains, stop operation and arrange
          professional service.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 8. UNSTABLE OUTPUT
  // ===================================================

  unstableOutput: {

    title:
      "⚡ Output Power is Unstable",

    cause: `
      <ul>

        <li>
          Connected load may be excessive.
        </li>

        <li>
          Input power may be unstable.
        </li>

        <li>
          Battery condition may be poor.
        </li>

        <li>
          UPS protection may be activating intermittently.
        </li>

        <li>
          An internal UPS fault may be present.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Check the input power supply.
        </li>

        <li>
          Reduce the connected load.
        </li>

        <li>
          Check the battery condition.
        </li>

        <li>
          Check whether the UPS indicates a warning or fault.
        </li>

        <li>
          If unstable output continues, arrange professional
          inspection.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 9. FREQUENT BATTERY SWITCHING
  // ===================================================

  frequentBattery: {

    title:
      "🔄 UPS Switches to Battery Frequently",

    cause: `
      <ul>

        <li>
          Mains input may be unstable.
        </li>

        <li>
          Input voltage may be outside the acceptable range.
        </li>

        <li>
          UPS input connections may be loose.
        </li>

        <li>
          UPS operating mode may be changing due to
          unstable supply conditions.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Check the incoming mains supply.
        </li>

        <li>
          Check the UPS input connection.
        </li>

        <li>
          Observe whether the problem occurs repeatedly.
        </li>

        <li>
          If frequent switching continues,
          arrange professional inspection.
        </li>

      </ol>
    `

  },


  // ===================================================
  // 10. UPS DOES NOT TURN ON
  // ===================================================

  notTurningOn: {

    title:
      "🔴 UPS/Inverter Does Not Turn ON",

    cause: `
      <ul>

        <li>
          Battery may be completely discharged.
        </li>

        <li>
          Mains input may be unavailable.
        </li>

        <li>
          Power switch may be OFF.
        </li>

        <li>
          Battery connection may be loose.
        </li>

        <li>
          An internal fault may have occurred.
        </li>

      </ul>
    `,

    solution: `
      <ol>

        <li>
          Check the mains supply.
        </li>

        <li>
          Check whether the UPS power switch is ON.
        </li>

        <li>
          Check the battery connection if it is safely
          accessible.
        </li>

        <li>
          Allow the battery to charge if it is deeply discharged.
        </li>

        <li>
          Try restarting the UPS according to the
          manufacturer's instructions.
        </li>

        <li>
          If the UPS still does not turn ON,
          arrange professional service.
        </li>

      </ol>
    `

  }

};


// =====================================================
// SHOW SELECTED PROBLEM
// =====================================================

function showProblem(problemId) {

  const problem =
    troubleshootingData[problemId];


  if (!problem) {

    return;

  }


  // Change title

  document.getElementById(
    "problemTitle"
  ).innerHTML =
    problem.title;


  // Change possible cause

  document.getElementById(
    "causeText"
  ).innerHTML =
    problem.cause;


  // Change recommended action

  document.getElementById(
    "solutionText"
  ).innerHTML =
    problem.solution;


  // Display details

  document.getElementById(
    "problemDetails"
  ).style.display =
    "block";


  // Scroll to selected problem

  document.getElementById(
    "problemDetails"
  ).scrollIntoView({
    behavior: "smooth"
  });

}


// =====================================================
// BACK TO DOCUMENTATION
// =====================================================

function goBack() {

  window.location.href =
    "documentation.html";

}


</script>


</body>

</html>

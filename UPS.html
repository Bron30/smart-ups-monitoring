<!DOCTYPE html>
<html>

<head>

  <title>Live Smart UPS Dashboard</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
    }

    header {
      background: #020617;
      padding: 15px;
      text-align: center;
      font-size: 22px;
    }

    .live {
      color: #22c55e;
      animation: blink 1s infinite;
    }

    @keyframes blink {

      50% {
        opacity: 0.3;
      }

    }

    .container {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(200px, 1fr));

      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .value {
      font-size: 30px;
      margin-top: 10px;
    }

    .status {
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .healthy {
      background: #16a34a;
    }

    .warning {
      background: #facc15;
      color: black;
    }

    .fault {
      background: #dc2626;
    }

    button {
      margin: 20px;
      padding: 10px 20px;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

  </style>

</head>


<body>


<header id="title">

  UPS Dashboard

  <br>

  <span class="live">
    ● LIVE
  </span>

</header>


<!-- =========================
     LIVE UPS PARAMETERS
     ========================= -->

<div class="container">


  <!-- BATTERY PERCENTAGE -->

  <div class="card">

    <h3>
      Battery Percentage
    </h3>

    <div id="battery"
         class="value">

      Checking authentication...

    </div>

  </div>


  <!-- BATTERY VOLTAGE -->

  <div class="card">

    <h3>
      Battery Voltage
    </h3>

    <div id="voltage"
         class="value">

      --

    </div>

  </div>


  <!-- LOAD CURRENT -->

  <div class="card">

    <h3>
      Load Current
    </h3>

    <div id="current"
         class="value">

      --

    </div>

  </div>


  <!-- TEMPERATURE -->

  <div class="card">

    <h3>
      Temperature
    </h3>

    <div id="temp"
         class="value">

      --

    </div>

  </div>


  <!-- VIBRATION -->

  <div class="card">

    <h3>
      Vibration
    </h3>

    <div id="vibration"
         class="value">

      --

    </div>

  </div>


  <!-- UPS STATUS -->

  <div class="card">

    <h3>
      UPS Status
    </h3>

    <div id="status"
         class="status">

      --

    </div>

  </div>


</div>


<center>

  <button onclick="goBack()">
    ⬅ Back
  </button>

</center>


<!-- =========================
     FIREBASE SDK
     ========================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>


<script>


// ==========================================
// GET UPS ID
// ==========================================

const params =
  new URLSearchParams(
    window.location.search
  );


const upsId =
  params.get("id") || "UPS1";


// ==========================================
// DISPLAY UPS ID
// ==========================================

document.getElementById("title").innerHTML =

  upsId +

  " Dashboard <br>" +

  "<span class='live'>● LIVE</span>";


// ==========================================
// FIREBASE CONFIGURATION
// ==========================================

var firebaseConfig = {

  apiKey:
    "AIzaSyAtUjNOxehowo3hBGQZ2Ln3-XgG7-LFTFo",

  authDomain:
    "qr-machine-project.firebaseapp.com",

  databaseURL:
    "https://qr-machine-project-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "qr-machine-project"

};


// ==========================================
// INITIALIZE FIREBASE
// ==========================================

firebase.initializeApp(
  firebaseConfig
);


// ==========================================
// FIREBASE AUTHENTICATION
// ==========================================

var auth =
  firebase.auth();


// ==========================================
// FIREBASE DATABASE
// ==========================================

var database =
  firebase.database();


// ==========================================
// DISPLAY FIREBASE ERROR
// ==========================================

function showFirebaseError(error) {

  console.error(
    "Firebase read error:",
    error
  );


  document.getElementById(
    "battery"
  ).innerText =
    "Firebase Error";


  document.getElementById(
    "voltage"
  ).innerText =
    "--";


  document.getElementById(
    "current"
  ).innerText =
    "--";


  document.getElementById(
    "temp"
  ).innerText =
    "--";


  document.getElementById(
    "vibration"
  ).innerText =
    "--";


  var statusEl =
    document.getElementById(
      "status"
    );


  statusEl.innerText =
    "DATABASE ERROR";


  statusEl.className =
    "status fault";

}


// ==========================================
// LOAD LIVE UPS DATA
// ==========================================

function loadUPSData() {


  console.log(
    "Loading UPS data for:",
    upsId
  );


  var latestRef =
    database.ref(
      upsId + "/Latest"
    );


  // ========================================
  // REAL-TIME DATABASE LISTENER
  // ========================================

  latestRef.on(

    "value",

    function(snapshot) {


      console.log(
        "Firebase UPS data:",
        snapshot.val()
      );


      var data =
        snapshot.val();


      // ====================================
      // NO DATA
      // ====================================

      if (!data) {

        document.getElementById(
          "battery"
        ).innerText =
          "--";


        document.getElementById(
          "voltage"
        ).innerText =
          "--";


        document.getElementById(
          "current"
        ).innerText =
          "--";


        document.getElementById(
          "temp"
        ).innerText =
          "--";


        document.getElementById(
          "vibration"
        ).innerText =
          "--";


        document.getElementById(
          "status"
        ).innerText =
          "NO DATA";


        document.getElementById(
          "status"
        ).className =
          "status fault";


        return;

      }


      // ====================================
      // BATTERY PERCENTAGE
      // ====================================

      document.getElementById(
        "battery"
      ).innerText =

        data.Battery_Percentage !== undefined

          ? data.Battery_Percentage + " %"

          : "--";


      // ====================================
      // BATTERY VOLTAGE
      // ====================================

      document.getElementById(
        "voltage"
      ).innerText =

        data.Voltage !== undefined

          ? data.Voltage

          : "--";


      // ====================================
      // LOAD CURRENT
      // ====================================

      document.getElementById(
        "current"
      ).innerText =

        data.Current !== undefined

          ? data.Current

          : "--";


      // ====================================
      // TEMPERATURE
      // ====================================

      document.getElementById(
        "temp"
      ).innerText =

        data.Temperature !== undefined

          ? data.Temperature

          : "--";


      // ====================================
      // VIBRATION
      // ====================================

      document.getElementById(
        "vibration"
      ).innerText =

        data.Vibration !== undefined

          ? data.Vibration

          : "--";


      // ====================================
      // UPS STATUS
      // ====================================

      var statusEl =
        document.getElementById(
          "status"
        );


      if (
        data.Status !== undefined
      ) {


        var status =
          String(data.Status);


        statusEl.innerText =
          status.toUpperCase();


        statusEl.className =
          "status";


        // ==================================
        // HEALTHY
        // ==================================

        if (
          status.toLowerCase() ===
          "healthy"
        ) {

          statusEl.classList.add(
            "healthy"
          );

        }


        // ==================================
        // WARNING
        // ==================================

        else if (
          status.toLowerCase() ===
          "warning"
        ) {

          statusEl.classList.add(
            "warning"
          );

        }


        // ==================================
        // FAULT / OTHER
        // ==================================

        else {

          statusEl.classList.add(
            "fault"
          );

        }

      }

      else {

        statusEl.innerText =
          "NO STATUS";

        statusEl.className =
          "status fault";

      }

    },

    function(error) {

      showFirebaseError(
        error
      );

    }

  );

}


// ==========================================
// AUTHENTICATION CHECK
// ==========================================

auth.onAuthStateChanged(
  function(user) {


    console.log(
      "Authentication state:",
      user
        ? user.email
        : "Not authenticated"
    );


    // ======================================
    // USER NOT AUTHENTICATED
    // ======================================

    if (!user) {


      document.getElementById(
        "battery"
      ).innerText =
        "LOGIN REQUIRED";


      document.getElementById(
        "status"
      ).innerText =
        "LOGIN REQUIRED";


      document.getElementById(
        "status"
      ).className =
        "status fault";


      // Redirect to gateway

      setTimeout(
        function() {

          window.location.href =
            "gateway.html?id=UPS001";

        },
        500
      );


      return;

    }


    // ======================================
    // USER AUTHENTICATED
    // ======================================

    console.log(
      "Authenticated user:",
      user.email
    );


    // ======================================
    // NOW READ FIREBASE
    // ======================================

    loadUPSData();

  }
);


// ==========================================
// BACK BUTTON
// ==========================================

function goBack() {

  window.location.href =
    "index.html";

}


</script>


</body>

</html>

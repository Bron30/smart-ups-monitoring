<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Smart UPS Dashboard</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      margin: 0;
    }

    h1 {
      margin-top: 30px;
    }

    .container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 40px;
      flex-wrap: wrap;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 200px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform: scale(1.05);
      background: #334155;
    }

    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
    }

    .healthy {
      background: #16a34a;
    }

    .warning {
      background: #facc15;
      color: black;
    }

    .fault {
      background: #dc2626;
    }

  </style>

</head>


<body>


<h1>🔋 Smart UPS Dashboard</h1>


<div class="container">


  <!-- =========================
       UPS UNIT
       ========================= -->

  <div class="card"
       onclick="openUPS('UPS1')">

    <h3>🔋 UPS Unit 1</h3>

    <div id="status_ups1"
         class="status">

      Loading...

    </div>

  </div>


  <!-- =========================
       MAINTENANCE
       ========================= -->

  <div class="card"
       onclick="openMaintenance('UPS1')">

    <h3>🔧 Maintenance</h3>

    <div class="status healthy">

      View Service Dates

    </div>

  </div>


  <!-- =========================
       DOCUMENTATION
       ========================= -->

  <div class="card"
       onclick="openDocumentation('UPS1')">

    <h3>📚 Documentation</h3>

    <div class="status healthy">

      View Documents

    </div>

  </div>


</div>


<!-- =========================
     FIREBASE
     ========================= -->

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>


<script>


// ==========================================
// FIREBASE CONFIGURATION
// ==========================================

var firebaseConfig = {

  apiKey:
    "AIzaSyAtUjNOxehowo3hBGQZ2Ln3-XgG7-LFTFo",

  databaseURL:
    "https://qr-machine-project-default-rtdb.asia-southeast1.firebasedatabase.app"

};


firebase.initializeApp(firebaseConfig);


// ==========================================
// OPEN UPS
// ==========================================

function openUPS(id) {

  window.location.href =
    "UPS.html?id=" + encodeURIComponent(id);

}


// ==========================================
// OPEN MAINTENANCE
// ==========================================

function openMaintenance(id) {

  window.location.href =
    "maintenance.html?id=" + encodeURIComponent(id);

}


// ==========================================
// OPEN DOCUMENTATION
// ==========================================

function openDocumentation(id) {

  window.location.href =
    "documentation.html?id=" + encodeURIComponent(id);

}


// ==========================================
// UPDATE UPS STATUS
// ==========================================

function updateStatus(upsId, elementId) {

  var ref =
    firebase.database().ref(
      upsId + "/Latest"
    );


  ref.on("value", function(snapshot) {

    var data =
      snapshot.val();


    var el =
      document.getElementById(elementId);


    if (
      data &&
      data.Status !== undefined
    ) {

      var status =
        String(data.Status);


      el.innerText =
        status.toUpperCase();


      el.className =
        "status";


      if (
        status.toLowerCase() ===
        "healthy"
      ) {

        el.classList.add("healthy");

      }

      else if (
        status.toLowerCase() ===
        "warning"
      ) {

        el.classList.add("warning");

      }

      else {

        el.classList.add("fault");

      }

    }

    else {

      el.innerText =
        "NO DATA";

      el.className =
        "status fault";

    }

  });

}


// ==========================================
// START UPS STATUS MONITORING
// ==========================================

updateStatus(
  "UPS1",
  "status_ups1"
);


</script>


</body>

</html>
